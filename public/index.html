    <main class="container">
      <section id="generator-section" class="app-section active">
        <div class="card">
          <h2>
            <i class="fas fa-file-invoice"></i> Generator Modul Ajar / RPP
          </h2>
          <p class="subtitle">
            Sesuaikan input untuk menghasilkan RPP Kurikulum Merdeka otomatis.
          </p>
          <form id="rpp-form">
            <div class="form-grid">
              <div class="form-group">
                <label for="schoolName">Nama Sekolah</label>
                <input
                  type="text"
                  id="schoolName"
                  placeholder="Contoh: SMK NASIONAL "
                  required
                />
              </div>
              <div class="form-group">
                <label for="taskOption">Jenis Tugas</label>
                <select id="taskOption">
                  <option value="Praktik">Praktik</option>
                  <option value="Soal-Uraian">Soal Uraian</option>
                  <option value="Pilihan-Ganda">Pilihan Ganda</option>
                  
                </select>
              </div>
                <div class="form-group">
                <label for="subject">Jurusan</label>
                <input
                  type="text"
                  id="jurusan"
                  placeholder="Contoh: Rekayasa perangkat lunak"
                  required
                />
              </div>
              <div class="form-group">
                <label for="subject">Bidang Studi</label>
                <input
                  type="text"
                  id="subject"
                  placeholder="Contoh: Pemrograman Website"
                  required
                />
              </div>
              <div class="form-group">
                <label for="gradeLevel">Fase / Kelas</label>
                <input
                  type="text"
                  id="gradeLevel"
                  placeholder="Contoh: Fase F / Kelas 11"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label for="topic">Topik / Materi Pokok</label>
              <textarea
                id="topic"
                rows="2"
                placeholder="Contoh: Pengenalan HTML"
              ></textarea>
            </div>

            <div
              class="advanced-toggle locked"
              id="advancedToggle"
            
            >
              <i class="fas fa-cog"></i> Kustomisasi Prompt API (Lanjutan)
            </div>

            <div id="prompt-config" class="hidden">
              <div class="form-group">
               <!--  <label for="systemPrompt">System Prompt</label>
                <textarea id="systemPrompt" rows="4"></textarea> -->
                <label for="userInstruction">Kustomisasi Output (Opsional)</label>
<textarea
  id="userInstruction"
  rows="3"
  placeholder="Contoh: gunakan bahasa lebih baku / buat soal HOTS / tambahkan indikator C6"
></textarea>

              </div>
            </div>

            <button type="submit" class="btn-primary" id="btnGenerate">
              <i class="fas fa-book"></i> Generate RPP Sekarang
            </button>

            
          </form>
        </div>

        <div id="result-container" class="card result-card hidden">
          <div class="result-header">
            <h3>Hasil Generasi</h3>
            
            <button
              class="btn-secondary"
              type="button"
              onclick="exportToWord()"
              id="downloadBtn"
            >
              <i class="fas fa-download"></i> <p>Download Word</p>
            </button>
          </div>
          <div id="rpp-output" class="markdown-body"></div>
        </div>
      </section>
