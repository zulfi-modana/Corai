<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduAI - Koreksi Plagiasi</title>

    <link rel="stylesheet" href="css/styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="container">
        <div class="logo">
          <i class="fas fa-graduation-cap"></i> CorAI
        </div>

        <ul class="nav-links">
          <li>
            <a href="index.html">Generator RPP</a>
          </li>
          <li>
            <a href="plagiasi.html" class="active">Koreksi Plagiasi</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- MAIN -->
    <main class="container">
      <section class="app-section active">

        <div class="card">
  <h2><i class="fas fa-check-double"></i> Koreksi Plagiasi</h2>
  <p class="subtitle">Input tugas siswa untuk dianalisis plagiasi</p>

  <form id="plagiasiForm">

    <!-- MODE -->
    <div class="form-group">
      <label>Pilih Mode Input</label>
      <select id="inputMode">
        <option value="pdf" selected>Upload PDF (Direkomendasikan)</option>
        <option value="text">Input Teks</option>
      </select>
    </div>

    <!-- TEXT MODE -->
    <div id="textContainer" style="display:none;">
      <label>Jawaban Siswa</label>

      <div id="textInputs">
        <textarea class="text-input" rows="4" placeholder="Jawaban siswa 1"></textarea>
        <textarea class="text-input" rows="4" placeholder="Jawaban siswa 2"></textarea>
      </div>

      <button type="button" id="addText" class="btn-secondary">
        + Tambah Jawaban
      </button>
    </div>

    <!-- PDF MODE -->
    <div id="pdfContainer">
      <div class="upload-area" id="dropZone">
        <i class="fas fa-file fa-2x"></i>
        <p>Klik atau Seret File PDF</p>
        <input type="file" id="pdfInput" accept="application/pdf" multiple hidden />
      </div>
    </div>

    <div id="fileList" class="file-list"></div>

    <!-- BUTTON -->
    <button type="submit" class="btn-primary">
      <i class="fas fa-search"></i> Analisis Jawaban
    </button>

  </form>
</div>


        <!-- RESULT -->
        <div id="correction-result" class="card result-card hidden">
          <div class="result-header">
            <h3>Hasil Analisis</h3>
          </div>

          

          <div id="correction-output" class="markdown-body"></div>

        </div>
      </section>
    </main>

    <!-- SCRIPT -->
    <script defer src="js/utils.js"></script>
    <script defer src="js/components.js"></script>
    <!-- <script defer src="js/script.js"></script> -->
    <script defer src="js/plagiasi.js"></script>
 

  </body>
</html>
